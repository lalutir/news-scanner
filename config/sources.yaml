# Source list — see CLAUDE.md "Sources (starting list)" for the paywall
# reasoning behind each entry. Verified September 2026; feed paths move,
# re-check before relying on a new one (news_scanner/fetch.py's --check-feeds
# mode does this).
#
# Deliberately excluded, do not add without checking the paywall model first:
# CNN (metered paywall since Oct 2024, judgment call either way), Reuters
# (metered + no public RSS since 2020), NRC / de Volkskrant / Trouw
# (subscriber-first, no meaningful free tier).

- name: NOS
  language: nl
  paywall: none
  feeds:
    - url: https://feeds.nos.nl/nosnieuwsbuitenland
      label: foreign
    - url: https://feeds.nos.nl/nosnieuwspolitiek
      label: politics

- name: VRT NWS
  language: nl
  paywall: none
  feeds:
